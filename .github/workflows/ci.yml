name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    name: lint · typecheck · test · build · e2e (mock mode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit + component tests (Vitest, RTL, MSW; offline)
        run: npm test
      - name: Build
        run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright smoke test against mock mode
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  integration:
    name: live integration (agent-runtime-gcp + mcp-integration-hub)
    runs-on: ubuntu-latest
    env:
      # Edit-args approvals live in vk-ai/agent-runtime-gcp#1 (branch feat/edit-args-approval).
      # Switch this back to "main" once that PR is merged.
      RUNTIME_REF: feat/edit-args-approval
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - name: Install the two backends from their public repos
        run: |
          python -m venv /tmp/rt && /tmp/rt/bin/pip install -q "agent-runtime-gcp @ git+https://github.com/vk-ai/agent-runtime-gcp@${RUNTIME_REF}"
          python -m venv /tmp/hub && /tmp/hub/bin/pip install -q "mcp-integration-hub @ git+https://github.com/vk-ai/mcp-integration-hub"
      - name: Start both and run the live tests
        env:
          RUNTIME_PY: /tmp/rt/bin/python
          HUB_PY: /tmp/hub/bin/python
          LOG_DIR: /tmp/backend-logs
        run: scripts/integration.sh
      - name: Backend logs
        if: always()
        run: tail -n 40 /tmp/backend-logs/*.log || true
